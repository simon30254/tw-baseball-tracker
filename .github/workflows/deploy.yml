name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # 每日資料更新 workflow 跑完後自動部署。
  # (必要:data-bot 用內建 GITHUB_TOKEN 推的 commit 不會觸發 push 事件,
  #  否則每日資料進了 repo 卻不會重新部署 → 正式站停在舊資料。)
  workflow_run:
    workflows: ["每日更新球員數據"]
    types: [completed]

# 讓 deploy job 有權限發佈 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只跑一個部署,新的推送會取代排隊中的舊部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Build + 靜態預渲染(球員頁 / sitemap / robots)
        run: npm run build:site
        env:
          # 自訂網域 players.clutchgtime.com 服務於根路徑,故 base=/
          BASE_PATH: /
          SITE_ORIGIN: https://players.clutchgtime.com

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
