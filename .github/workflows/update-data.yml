name: 每日更新球員數據

on:
  schedule:
    # UTC 22:00 = 台灣早上 6:00(美國比賽多已結束)
    - cron: "0 22 * * *"
  workflow_dispatch: {} # 允許手動觸發,方便測試

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取旅美(MLB)
        run: python3 scripts/fetch_data.py

      - name: 抓取旅日(NPB)
        run: python3 scripts/fetch_npb.py

      - name: 抓取旅韓(KBO)
        run: python3 scripts/fetch_kbo.py

      # 歷代球員(已離開大聯盟體系者)。名單無變動且資料不滿 7 天就會自己跳過,
      # 平常只花兩次 API 補掃最近兩季找新面孔。
      - name: 更新歷代旅外球員(失敗不擋)
        run: python3 scripts/fetch_alumni.py || true

      # 必須排在 fetch_alumni 之後:後者重建 alumni.json 時只會寫入旅美球員,
      # 旅日前輩要由這支再併回去(陳偉殷的美日兩段生涯也是在這裡合起來的)。
      - name: 更新歷代旅日球員(失敗不擋)
        run: python3 scripts/fetch_npb_alumni.py || true

      - name: 更新歷代旅韓球員(失敗不擋)
        run: python3 scripts/fetch_kbo_alumni.py || true

      - name: 拉取 clutchgtime 相關報導(內容飛輪,失敗不擋)
        run: python3 scripts/fetch_articles.py || true

      # MLB 官方異動(DFA、下放、升上大聯盟、傷兵進出)。消息頁的事實主要來自這裡。
      # 讀的是上一輪 commit 的 players.json 取名單(同 fetch_articles / fetch_news),
      # 所以排在 build_players 之前沒問題;名單一天的落差不影響異動查詢。
      - name: 抓取官方異動紀錄(失敗不擋)
        run: python3 scripts/fetch_transactions.py || true

      # 媒體消息:Bing News RSS 逐位球員查,累積成 news.json 給首頁側欄與 /news/。
      # 失敗不擋 —— 消息是加值內容,抓不到的那天沿用既有 news.json 就好,
      # 不該讓整個戰報的資料更新跟著紅燈。
      - name: 抓取媒體新聞(最新消息,失敗不擋)
        run: python3 scripts/fetch_news.py || true

      # 投手球種:MLB Stats API 的 pitchArsenal,需在 players.json 已存在時跑,
      # 故排在 build_players 之後由下一輪使用(當日仍會被同一次 build 掛上)。
      - name: 抓取投手球種(失敗不擋)
        run: python3 scripts/fetch_arsenal.py || true

      # 進階數據:需在歷代球員三支之後(會寫回 alumni.json)、build_players 之前
      # (build 會把快取掛到現役球員身上)。歷史球季走快取,每天只重抓當季。
      # 分項數據(對左右、主客場)。每天都在變,沒有快取;連小聯盟都有資料。
      - name: 抓取分項數據(失敗不擋)
        run: python3 scripts/fetch_splits.py || true

      - name: 抓取進階數據 FIP/WAR(失敗不擋)
        run: python3 scripts/fetch_advanced.py || true

      # 歷史逐場:往年的值不會再變,抓過就跳過,平常這步幾乎不花時間;
      # 只有球季結束、前一季進入 prev_season 時才會真的去抓。
      - name: 抓取歷史逐場紀錄(失敗不擋)
        run: python3 scripts/fetch_gamelogs.py || true

      - name: 抓取亮點精華影片(YouTube,失敗不擋)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/fetch_videos.py || true

      - name: 合併為 players.json
        run: python3 scripts/build_players.py

      - name: Commit 更新後的 JSON
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add public/data/*.json scripts/videos_cache.json
          git diff --cached --quiet && { echo "無變更,不需 commit"; exit 0; }
          git commit -m "data: update $(date -u +'%Y-%m-%d')"
          # 跑資料的期間若有人 push(手改腳本等),直接 push 會被 rejected;
          # rebase 後重試,避免整個 run 掛掉、連帶把後面的 clutchgtime 同步跳過。
          for i in 1 2 3; do
            git push && exit 0
            echo "push 被拒(第 $i 次),pull --rebase 後重試…"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "::error::push 連續 3 次失敗"; exit 1

      # if: always() → 即使上面 commit/push 失敗,WP 同步仍要跑。
      # 資料抓取步驟若失敗,job 會在 build_players 之前就中止,
      # 此時 players.json 仍是上次 commit 的正常版本,同步結果為「已是最新」,無副作用。
      - name: 同步 clutchgtime 球員專文數據(內容飛輪,失敗不擋)
        if: always()
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          PLAYERS_JSON: public/data/players.json
        run: python3 scripts/update_clutchgtime.py --apply || true

      - name: 同步 clutchgtime 旅外總表 pillar 數據(內容飛輪,失敗不擋)
        if: always()
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          PLAYERS_JSON: public/data/players.json
        run: python3 scripts/update_clutchgtime_hubs.py --apply || true

      # 只盤點、不改文章:每天把「有比賽但還沒寫戰報」的清單印到 run summary,
      # 補稿時看清單辦事,不用每次重新翻文章對日期。
      - name: 盤點逐場戰報缺口(只讀,不擋)
        if: always()
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          PLAYERS_JSON: public/data/players.json
        run: |
          {
            echo '## 逐場戰報待補清單'
            echo '```'
            python3 scripts/report_gaps.py 2>&1 || echo '(盤點失敗)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
