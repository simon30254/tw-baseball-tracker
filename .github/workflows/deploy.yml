name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # 每日資料更新 workflow 跑完後自動部署。
  # (必要:data-bot 用內建 GITHUB_TOKEN 推的 commit 不會觸發 push 事件,
  #  否則每日資料進了 repo 卻不會重新部署 → 正式站停在舊資料。)
  workflow_run:
    workflows: ["每日更新球員數據"]
    types: [completed]

# 讓 deploy job 有權限發佈 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只跑一個部署,新的推送會取代排隊中的舊部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Build + 靜態預渲染(球員頁 / sitemap / robots)
        run: npm run build:site
        env:
          # 自訂網域 players.clutchgtime.com 服務於根路徑,故 base=/
          BASE_PATH: /
          SITE_ORIGIN: https://players.clutchgtime.com

      # 表現頁的社群分享卡(每頁一張)。**必須在 build 之後**(要寫進 dist/,而且
      # 要讀 prerender 寫的 .perf-pages.json),產物不進 git —— 每天兩百多張 PNG 的
      # 二進位差異會把 repo 撐爆,所以每次部署重產。
      # runner 沒有中文字型,要先裝 Noto CJK,否則圖上會是一排豆腐。
      - name: 產生分享圖卡(失敗不擋部署)
        run: |
          # fonts-noto-cjk = 中文;dejavu/liberation 提供數字用的窄體重字
          # (數字若用中文字型渲染會偏圓、字重上不去,放大後看起來就是軟的)
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-dejavu-core fonts-liberation
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 scripts/make_play_cards.py || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
